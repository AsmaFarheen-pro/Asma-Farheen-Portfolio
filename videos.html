      <dialog class="reel-viewer" aria-label="Video reel viewer">
        <button
          class="reel-viewer-close"
          type="button"
          aria-label="Close video viewer"
        >
          &times;
        </button>
        <button
          class="reel-viewer-nav reel-viewer-previous"
          type="button"
          aria-label="Previous video"
        >
          &#8249;
        </button>
        <video class="reel-viewer-video" controls playsinline></video>
        <button
          class="reel-viewer-nav reel-viewer-next"
          type="button"
          aria-label="Next video"
        >
          &#8250;
        </button>
        <p class="reel-viewer-count" aria-live="polite"></p>
      </dialog>

    <script>
      const reelVideos = Array.from(
        document.querySelectorAll(".reel-card video"),
      );
      const reelViewer = document.querySelector(".reel-viewer");
      const viewerVideo = reelViewer.querySelector(".reel-viewer-video");
      const viewerCount = reelViewer.querySelector(".reel-viewer-count");
      let currentReelIndex = 0;
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      function showReel(index) {
        currentReelIndex = (index + reelVideos.length) % reelVideos.length;
        reelVideos.forEach((video) => video.pause());
        viewerVideo.src = reelVideos[currentReelIndex].querySelector("source").src;
        viewerCount.textContent = `${currentReelIndex + 1} / ${reelVideos.length}`;
      }

      reelVideos.forEach((video, index) => {
        video.removeAttribute("controls");
        video.tabIndex = 0;
        video.setAttribute("role", "button");
        video.setAttribute("aria-label", `Play video reel ${index + 1}`);

        const openViewer = () => {
          showReel(index);
          reelViewer.showModal();
          viewerVideo.play().catch(() => {});
        };

        video.addEventListener("click", openViewer);
        video.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openViewer();
          }
        });
      });

      reelViewer.querySelector(".reel-viewer-close").addEventListener("click", () => {
        reelViewer.close();
      });
      reelViewer.querySelector(".reel-viewer-previous").addEventListener("click", () => {
        showReel(currentReelIndex - 1);
        viewerVideo.play().catch(() => {});
      });
      reelViewer.querySelector(".reel-viewer-next").addEventListener("click", () => {
        showReel(currentReelIndex + 1);
        viewerVideo.play().catch(() => {});
      });
      reelViewer.addEventListener("close", () => {
        viewerVideo.pause();
        viewerVideo.removeAttribute("src");
        viewerVideo.load();

        if (!prefersReducedMotion) {
          reelVideos.forEach((video) => {
            const bounds = video.getBoundingClientRect();
            if (bounds.bottom > 0 && bounds.top < window.innerHeight) {
              video.play().catch(() => {});
            }
          });
        }
      });

      if ("IntersectionObserver" in window && !prefersReducedMotion) {
        const reelObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (reelViewer.open) {
                entry.target.pause();
                return;
              }

              if (entry.isIntersecting) {
                entry.target.play().catch(() => {});
              } else {
                entry.target.pause();
              }
            });
          },
          { threshold: 0.25 },
        );

        reelVideos.forEach((video) => {
          video.muted = true;
          video.loop = true;
          video.preload = "none";
          reelObserver.observe(video);
        });
      }
    </script>

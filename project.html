        </button>

        </button>

    <script>
      const imageViewer = document.querySelector(".image-viewer");
      const expandedImage = imageViewer.querySelector(".image-viewer-image");
      const closeViewer = imageViewer.querySelector(".image-viewer-close");
      const previousButton = imageViewer.querySelector(
        ".image-viewer-previous",
      );
      const nextButton = imageViewer.querySelector(".image-viewer-next");
      const imageCount = imageViewer.querySelector(".image-viewer-count");
      const galleryImages = Array.from(
        document.querySelectorAll(".asset-gallery-item img"),
      );
      let currentImageIndex = 0;

      galleryImages.forEach((image) => {
        const caption = document.createElement("figcaption");
        caption.className = "project-caption";

        const title = document.createElement("span");
        title.textContent = image.alt || "Creative work";
        caption.append(title);

        const options = document.createElement("details");
        options.className = "project-options";

        const summary = document.createElement("summary");
        summary.setAttribute("aria-label", "More options");
        summary.innerHTML = "&hellip;";
        options.append(summary);

        const download = document.createElement("a");
        download.href = image.src;
        download.download = image.src.split("/").pop();
        download.textContent = "Download image";
        options.append(download);

        caption.append(options);
        image.closest(".asset-gallery-item").append(caption);
      });

      function showImage(index) {
        currentImageIndex =
          (index + galleryImages.length) % galleryImages.length;
        const image = galleryImages[currentImageIndex];
        expandedImage.src = image.src;
        expandedImage.alt = image.alt;
        imageCount.textContent = `${currentImageIndex + 1} / ${galleryImages.length}`;
      }

      galleryImages.forEach((image, index) => {
        image.tabIndex = 0;
        image.setAttribute("role", "button");
        image.setAttribute("aria-label", `View ${image.alt} larger`);

        const openViewer = () => {
          showImage(index);
          imageViewer.showModal();
        };

        image.addEventListener("click", openViewer);
        image.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openViewer();
          }
        });
      });

      closeViewer.addEventListener("click", () => imageViewer.close());
      previousButton.addEventListener("click", () =>
        showImage(currentImageIndex - 1),
      );
      nextButton.addEventListener("click", () =>
        showImage(currentImageIndex + 1),
      );
      imageViewer.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          showImage(currentImageIndex - 1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          showImage(currentImageIndex + 1);
        }
      });

      let touchStartX = 0;
      expandedImage.addEventListener(
        "touchstart",
        (event) => {
          touchStartX = event.changedTouches[0].screenX;
        },
        { passive: true },
      );
      expandedImage.addEventListener(
        "touchend",
        (event) => {
          const swipeDistance = event.changedTouches[0].screenX - touchStartX;
          if (Math.abs(swipeDistance) > 50) {
            showImage(currentImageIndex + (swipeDistance < 0 ? 1 : -1));
          }
        },
        { passive: true },
      );

      imageViewer.addEventListener("click", (event) => {
        if (event.target === imageViewer) imageViewer.close();
      });
    </script>
